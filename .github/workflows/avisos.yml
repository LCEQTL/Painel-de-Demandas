# Rotina de avisos do Painel de Demandas.
# Roda quando uma demanda muda (push na branch "dados") e a cada 20 minutos.
# Decifra os dados com o segredo PAINEL_CHAVE, monta os avisos e abre uma issue no repositório de avisos
# (o Power Automate lê a issue e manda os e-mails). Os logs só mostram contagens, nunca nomes ou textos.
name: Avisos do painel
on:
  push:
    branches: [dados]
    paths: ["db/demandas/**"]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: avisos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: site
      - uses: actions/checkout@v4
        with:
          ref: dados
          path: dados
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gerar avisos
        env:
          PAINEL_CHAVE: ${{ secrets.PAINEL_CHAVE }}
          AVISOS_TOKEN: ${{ secrets.AVISOS_TOKEN }}
        run: node site/.github/avisos/run.mjs
      - name: Salvar estado dos avisos
        working-directory: dados
        run: |
          git config user.name "painel-avisos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avisos/estado.enc
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Avisos: estado"
          for i in 1 2 3 4; do
            if git push -q; then exit 0; fi
            git pull -q --rebase
          done
          exit 1
